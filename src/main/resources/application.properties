spring.application.name=GuildOfPioneersBackend

app.timezone=${APP_TIMEZONE:UTC+8}
app.upload-dir=${APP_UPLOAD_DIR:./uploads}
app.default-avatar=${APP_DEFAULT_AVATAR:./default_avatar.jpg}
app.default-avatar-enabled=${APP_DEFAULT_AVATAR_ENABLED:true}
app.seed-data=${APP_SEED_DATA:true}
app.admin-seed=${APP_ADMIN_SEED:true}
app.admin-password=${APP_ADMIN_PASSWORD:password123}
app.veil.database-type=${VEIL_DB_TYPE:POSTGRES}

spring.servlet.multipart.max-file-size=${APP_MAX_AVATAR_SIZE:5MB}
spring.servlet.multipart.max-request-size=6MB

spring.datasource.url=jdbc:postgresql://localhost:5432/guild
spring.datasource.username=${DB_USERNAME:guild}
spring.datasource.password=${DB_PASSWORD:guild}

spring.jpa.hibernate.ddl-auto=none

spring.flyway.locations=classpath:db/migration
