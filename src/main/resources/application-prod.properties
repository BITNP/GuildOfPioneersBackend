app.timezone=${APP_TIMEZONE:UTC+8}
app.seed-data=${APP_SEED_DATA:false}
app.admin-seed=${APP_ADMIN_SEED:true}
app.admin-password=${APP_ADMIN_PASSWORD}

app.storage.type=${STORAGE_TYPE:s3}
app.storage.endpoint=${S3_ENDPOINT}
app.storage.region=${S3_REGION:us-east-1}
app.storage.access-key=${S3_ACCESS_KEY}
app.storage.secret-key=${S3_SECRET_KEY}
app.storage.bucket=${S3_BUCKET:guild}
app.storage.path-style-access=${S3_PATH_STYLE:true}
app.storage.create-bucket=${S3_CREATE_BUCKET:true}

spring.servlet.multipart.max-file-size=${APP_MAX_AVATAR_SIZE:5MB}
spring.servlet.multipart.max-request-size=6MB

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.flyway.locations=classpath:db/migration

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
