spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=KEY
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration

# Use the in-memory storage backend so tests do not need an S3-compatible server.
app.storage.type=memory
app.default-avatar-enabled=false
app.seed-data=false
app.oidc.issuer=http://localhost:8082/realms/guild
app.oidc.client-id=guild-test
app.oidc.client-secret=test-secret
app.oidc.public-url=http://localhost:5173
app.oidc.bootstrap-admin-subject=bootstrap-admin-subject
server.servlet.session.timeout=30m
