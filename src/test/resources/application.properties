spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=KEY
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration

# Veil's upsert uses PostgreSQL-only SQL, so its write path cannot run against H2.
app.default-avatar-enabled=false
