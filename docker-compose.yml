services:
  postgres:
    image: postgres:17-alpine
    container_name: guild-postgres
    environment:
      POSTGRES_DB: guild
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: guild
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild -d guild"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      additional_contexts:
        veil_m2: ~/.m2/repository/com/potato
    container_name: guild-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/guild
      DB_USERNAME: guild
      DB_PASSWORD: guild
      VEIL_DB_TYPE: POSTGRES
      APP_TIMEZONE: UTC+8
      APP_SEED_DATA: "false"
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  uploads_data:
